date.localeCompare(a.date)).slice(0,5).map(x=>`<div class="timeline-item"><div class="timeline-date">${datePretty(x.date)}</div><div class="timeline-text">${esc(x.text.length>66?x.text.slice(0,66)+'…':x.text)}</div></div>`).join('')||'<p class="record-empty">开始记录后，这里会出现时间线</p>'}</div></div></div><div class="insight"><div class="insight-title">${ic('sparkles')} 本月的一句话回顾 · 演示分析</div><p>${esc(makeSummary())}</p><button class="linkbtn" data-action="agent-summary">与助手聊聊这个月 ${ic('arrow','sm')}</button></div>${old.length?`<div class="section-title"><h2>值得重新看看的计划</h2><small>${old.length} 项超过 30 天未完成</small></div>${old.map(t=>`<div class="reminder" style="margin-bottom:10px"><div class="reminder-label">${ic('clock','sm')} 旧计划回访</div><h4>${esc(t.title)}</h4><p>${datePretty(t.created)} 创建，后来一直没有标记完成。还要继续推进吗？</p><div class="reminder-actions"><button class="btn small" data-action="renew" data-id="${t.id}">继续推进</button><button class="btn secondary small" data-action="task-complete" data-id="${t.id}">已完成</button><button class="btn secondary small" data-action="dismiss" data-id="${t.id}">搁置</button></div></div>`).join('')}`:''}`}
function makeSummary(){const d=state.tasks.filter(t=>t.done).length;const total=state.tasks.length;const reading=state.books.map(b=>`《${b.name}》读到 ${b.current}/${b.total} 页`).join('、');const courses=state.courses.map(c=>`${c.name}完成 ${c.current}/${c.total} 章`).join('、');return `截至目前，你保存了 ${state.notes.length} 条生活与思考记录、${state.logs.length} 条学习记录，完成 ${d}/${total} 项待办。${reading?`阅读方面，${reading}。`:''}${courses?`学习方面，${courses}。`:''}这些是基于实际存储记录的汇总；如果记录有限，不能据此判断你的长期成长程度。`}

function formAddType(){showModal(`${modalHeader('想记录什么？')}<p class="page-sub" style="margin:-8px 0 19px">功能不必都放在首页，需要的时候再创建。</p><div class="library-list"><button class="btn secondary" style="min-height:70px" data-action="task-add">${ic('check')} 新建待办</button><button class="btn secondary" data-action="parent-book">📚 添加书籍</button><button class="btn secondary" style="min-height:70px" data-action="parent-course">💻 添加课程</button><button class="btn secondary" data-action="note-add">${ic('note')} 写随笔 / 日记</button></div><div class="modal-foot"><button class="btn" data-action="agent">${ic('sparkles','sm')} 直接告诉 AI 助手</button></div>`) }
function formRecord(type,id){const parent=(type==='book'?state.books:state.courses).find(x=>x.id===id);if(!parent)return toast('没有找到这条学习项目');modalContext={type,id};const cnt=state.logs.filter(l=>l.parentType===type&&l.parentId===id).length;showModal(`${modalHeader('新增学习记录')}<p class="page-sub" style="margin:-10px 0 20px">${type==='book'?'📚':'💻'} ${esc(parent.name)} · 自动命名为学习记录 ${cnt+1}</p><form id="form-record"><div class="field"><label>${type==='book'?'本次主题 / 章节':'课程章节或主题'}</label><input name="chapter" value="${type==='course'?'第'+parent.current+'章':''}" placeholder="例如：第一章 · 个人反思" /></div><div class="field"><label>你学到了什么？</label><textarea name="body" placeholder="记录新的理解、感受或者疑问……" required></textarea></div><div class="field"><label>相关视频 / 资料链接（可选）</label><input type="url" name="link" placeholder="https://..." /></div><div class="modal-foot"><button type="button" class="btn secondary" data-action="modal-close">取消</button><button class="btn" type="submit">保存学习记录</button></div></form>`) }
function viewParent(type,id){let parent=(type==='book'?state.books:state.courses).find(p=>p.id===id);if(!parent)return;const logs=state.logs.filter(l=>l.parentType===type&&l.parentId===id).sort((a,b)=>b.createdAt-a.createdAt);showModal(`${modalHeader((type==='book'?'📚 ':'💻 ')+esc(parent.name))}<p class="page-sub">${type==='book'?'阅读':'课程'}进度 · ${parent.current}/${parent.total} ${type==='book'?'页':'章'}</p><div class="track" style="margin:15px 0 20px"><div class="fill" style="width:${Math.min(100,100*parent.current/parent.total)}%"></div></div><form id="form-progress"><input type="hidden" name="type" value="${type}"/><input type="hidden" name="id" value="${esc(id)}"/><div class="field-line"><div class="field"><label>当前进度</label><input type="number" name="current" value="${parent.current}" min="0" max="${parent.total}" required /></div><div class="field"><label>总进度</label><input type="number" name="total" value="${parent.total}" min="1" required /></div></div><button class="btn secondary small" type="submit">更新进度</button></form><div class="section-title"><h2>学习记录</h2><small>${logs.length} 条 · 新记录在前</small></div>${logs.length?logs.map(l=>`<div class="record-row"><div class="record-date">${datePretty(l.date)} · ${esc(l.title)}</div><div class="record-text">${esc(l.body)}</div>${l.link?`<a href="${esc(ensureUrl(l.link))}" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:#317f63">查看相关资料 ↗</a>`:''}</div>`).join(''):'<div class="record-empty">还没有学习记录，点击下方添加第一条</div>'}<div class="modal-foot"><button class="btn secondary" data-action="modal-close">关闭</button><button class="btn" data-action="open-record" data-type="${type}" data-id="${esc(id)}">${ic('plus','sm')} 新增学习记录</button></div>`) }
function ensureUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function viewTask(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;showModal(`${modalHeader('待办详情')}<div class="field"><label>任务内容</label><p style="font-size:16px;font-weight:750;margin:2px 0">${esc(t.title)}</p></div><div class="field-line"><div class="field"><label>分类</label><p>${esc(t.group||'个人')}</p></div><div class="field"><label>日期</label><p>${datePretty(t.due)}</p></div></div><div class="field"><label>状态</label><p>${t.done?'✅ 已完成':(t.paused?'⏸ 已搁置':'◯ 进行中')}</p></div><div class="modal-foot"><button class="btn secondary" data-action="modal-close">关闭</button><button class="btn" data-action="task-toggle" data-id="${id}">${t.done?'撤销完成':'标记完成'}</button></div>`) }
function openAgent(){closeModal();document.getElementById('agent-layer').classList.add('show');renderChat();setTimeout(()=>document.getElementById('chat-input')?.focus(),100)}
function closeAgent(){document.getElementById('agent-layer').classList.remove('show')}
function renderChat(){const root=document.getElementById('chat-messages');const initial=`<div class="chat-row"><div class="chat-icon">${ic('sparkles','sm')}</div><div class="chat-bubble">你好，我是 LifeOS 记录助手 ✨\n\n直接告诉我今天做了什么、读了什么书、学了哪一章，或想让我提醒什么。\n\n我会帮你自动分类、保存，并把结果展示给你。</div></div>`;root.innerHTML=initial+state.chat.slice(-25).map(m=>`<div class="chat-row ${m.who==='me'?'me':''}">${m.who==='bot'?`<div class="chat-icon">${ic('sparkles','sm')}</div>`:''}<div class="chat-bubble">${esc(m.text)}${m.receipts?.length?`<div class="receipt">${m.receipts.map(r=>`<div class="receipt-row">${ic('check','sm')} ${esc(r.text)}</div>`).join('')}<button class="receipt-open" data-page="library">查看本次记录 ${ic('arrow','sm')}</button></div>`:''}</div></div>`).join('');root.scrollTop=root.scrollHeight}
function agentSubmit(){const input=document.getElementById('chat-input');const val=input.value.trim();if(!val)return;input.value='';processAgent(val)}
function ensureBook(name){let found=state.books.find(b=>b.name===name||b.name.includes(name)||name.includes(b.name));if(!found){found={id:uid('b'),name,current:0,total:300,created:todayISO()};state.books.push(found)}return found}
function ensureCourse(name){let found=state.courses.find(c=>c.name.includes(name)||name.includes(c.name));if(!found){found={id:uid('c'),name,current:0,total:10,created:todayISO()};state.courses.push(found)}return found}
function newLog(type,obj,body,chapter=''){const count=state.logs.filter(l=>l.parentType===type&&l.parentId===obj.id).length;let title=(chapter?chapter+' · ':'')+'学习记录 '+(count+1);state.logs.push({id:uid('l'),parentType:type,parentId:obj.id,title,body:body||'本次更新了学习进度。',date:todayISO(),createdAt:Date.now(),link:''});activity();return title}
function newNote(text){const journal=/(日记|生活|今天心情|今天发生)/.test(text),type=journal?'journal':'thought';state.notes.push({id:uid('n'),type,title:journal?'今日生活记录':'随手记 · '+datePretty(todayISO()),body:text,date:todayISO(),createdAt:Date.now()});activity();return journal?'生活日记':'思考随笔'}
function extractCourse(chunk){let m=chunk.match(/课程[《「]?([^》，。的第]+)[》」]?/);if(m)return m[1].trim().replace(/^(?:学了|学习|了)/,'');if(/产品经理/.test(chunk))return 'AI 产品经理入门';if(/AI/.test(chunk))return 'AI 课程';return '我的学习课程'}
function processAgent(raw){openAgent();state.chat.push({who:'me',text:raw});const receipts=[];const lower=raw.trim();if(/(帮我|给我|看看|生成|总结|回顾).{0,7}(这个月|本月|月度|最近的记录|最近)/.test(lower)||/(这个月|本月).{0,5}(回顾|总结)/.test(lower)){state.chat.push({who:'bot',text:makeSummary()+'\n\n你可以在「成长回顾」查看具体记录和活动图表。'});save();renderAll();renderChat();return}
const chunks=raw.split(/[，,。；;\n]+/).map(t=>t.trim()).filter(Boolean);let lastLearning=null;for(let c of chunks){let handled=false;
// Creating reminders takes precedence over other interpretation.
const remind=c.match(/(?:提醒我|记得提醒我)(.+)/);if(remind){let title=remind[1].trim().replace(/^(?:在|去|要)/,'');let delta=0;if(/后天/.test(c))delta=2;else if(/明天/.test(c))delta=1;else if(/周末/.test(c)){let d=new Date().getDay();delta=(6-d+7)%7||7}else{let days=c.match(/(\d+)天后/);if(days)delta=Number(days[1])}title=title.replace(/^(?:明天|后天|周末|\d+天后)/,'').trim();if(title){const t={id:uid('t'),title,done:false,due:shiftDate(delta),group:'提醒',created:todayISO()};state.tasks.push(t);activity();receipts.push({text:`已创建提醒「${title}」· ${datePretty(t.due)}（应用内）`});handled=true}}
if(handled)continue;
const bookMatch=c.match(/《([^》]+)》/);if(bookMatch&&/(读|阅读|看|书|页)/.test(c)){let obj=ensureBook(bookMatch[1]);const pageTo=c.match(/(?:到|至|读到|看到|第)\s*(\d+)\s*页/);const pages=c.match(/(?:读了|看了|阅读了|又读了|读完了)\s*(\d+)\s*页/)||((/(读|看|阅读)/.test(c))?c.match(/》\s*(\d+)\s*页/):null);const old=obj.current;if(pageTo)obj.current=Math.max(0,Number(pageTo[1]));else if(pages)obj.current=Math.max(0,obj.current+Number(pages[1]));if(obj.current>obj.total)obj.total=obj.current;let reflection=c.replace(/(?:今天|刚才|晚上|早上|中午|我|又)/g,'').replace(bookMatch[0],'').replace(/(?:读|看|阅读|到了?|至|第|\d+|页|了|，|\s)+/g,'').trim();if(reflection.length>=7)newLog('book',obj,reflection);receipts.push({text:`《${obj.name}》阅读进度：${old} → ${obj.current} 页${reflection.length>=7?'，并保存一条学习记录':''}`});lastLearning={type:'book',obj};handled=true}
if(handled)continue;
if(/(学|课程|第\s*\d+\s*[章节课])/.test(c)&&/(课程|第\s*\d+\s*[章节课]|学习了|学完|学了)/.test(c)){const name=extractCourse(c),obj=ensureCourse(name),chap=c.match(/第\s*(\d+)\s*[章节课]/);const old=obj.current;if(chap)obj.current=Math.max(obj.current,Number(chap[1]));if(obj.current>obj.total)obj.total=obj.current;const remainder=c.split(/[，,]/).slice(1).join('')||c.replace(/.*?第\s*\d+\s*[章节课]/,'').replace(/^了?[，, ]*/,'');if(remainder&&remainder.length>=5)newLog('course',obj,remainder,chap?'第'+chap[1]+'章':'');receipts.push({text:`${obj.name}：${old} → ${obj.current} 章${remainder.length>=5?'，并保存学习感受':''}`});lastLearning={type:'course',obj};handled=true}
if(handled)continue;
const completed=c.match(/(?:今天|刚才|我)?(?:已经|终于)?(?:完成了|做完了|搞定了)(.+)/);if(completed){let title=completed[1].trim();let matched=state.tasks.find(t=>!t.done&&(t.title.includes(title)||title.includes(t.title)));if(matched){matched.done=true;matched.doneAt=todayISO();receipts.push({text:`任务「${matched.title}」已标记完成`})}else{state.tasks.push({id:uid('t'),title,done:true,due:todayISO(),group:'工作记录',created:todayISO(),doneAt:todayISO()});receipts.push({text:`已创建并完成「${title}」`})}activity();handled=true}
if(handled)continue;
const todo=c.match(/(?:我要|打算|计划|准备|待办|记得|安排)(.+)/);if(todo){let title=todo[1].trim().replace(/^(?:明天|今天|后天|下周|周末)/,'').trim();if(title){let delta=/后天/.test(c)?2:/明天/.test(c)?1:0;state.tasks.push({id:uid('t'),title,done:false,due:shiftDate(delta),group:'个人',created:todayISO()});activity();receipts.push({text:`待办「${title}」已创建 · ${datePretty(shiftDate(delta))}`});handled=true}}
if(!handled){if(lastLearning&&/(理解|觉得|感觉|复杂|疑问|知识|笔记|收获|学会|发现|印象|不懂|困惑)/.test(c)&&c.length>=5){const title=newLog(lastLearning.type,lastLearning.obj,c,lastLearning.type==='course'?'第'+lastLearning.obj.current+'章':'');receipts.push({text:`已将「${c.slice(0,16)}${c.length>16?'…':''}」附加到${lastLearning.obj.name} · ${title}`});lastLearning=null}else{let type=newNote(c);receipts.push({text:`已保存一条${type}`})}}
}
if(!receipts.length){state.chat.push({who:'bot',text:'我没识别到明确的操作。你可以直接说「读《曾国藩传》到第35页」或「明天提醒我整理报告」。'})}else state.chat.push({who:'bot',text:`已帮你整理好了，共处理 ${receipts.length} 项：\n\n你可以点击下方查看，也可以直接再告诉我新的进度。`,receipts});save();renderAll();renderChat();toast(`助手已处理 ${receipts.length} 条记录`)}
function completeTask(id,val){const t=state.tasks.find(t=>t.id===id);if(!t)return;t.done=val===undefined?!t.done:val;if(t.done){t.doneAt=todayISO();activity()}else delete t.doneAt;save();renderAll();toast(t.done?'已完成，今天又前进一步！':'已恢复为待办');if(document.getElementById('modal-layer').classList.contains('show'))closeModal()}
function dismiss(id){state.dismissed.push(id);const t=state.tasks.find(t=>t.id===id);if(t)t.paused=true;save();renderAll();toast('已搁置，不再重复提醒')}
function renew(id){const t=state.tasks.find(t=>t.id===id);if(t){t.due=todayISO();t.created=todayISO();t.paused=false;state.dismissed=state.dismissed.filter(x=>x!==id)}save();renderAll();toast('已重新安排到今天')}
function editViewNote(id){let n=state.notes.find(n=>n.id===id);if(n)formNote(n.type,n)}
function agentSummary(){openAgent();state.chat.push({who:'bot',text:'📊 这里是根据当前保存的数据自动生成的回顾：\n\n'+makeSummary()+'\n\n如果有旧任务暂时不想推进，可以在「成长回顾」中将它搁置。'});save();renderChat()}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('当前浏览器不支持语音识别，建议用 Chrome 或文字输入');return}const recognizer=new SR();recognizer.lang='zh-CN';recognizer.interimResults=false;recognizer.onresult=e=>{document.getElementById('chat-input').value=e.results[0][0].transcript;toast('已转为文字，检查后点击发送')};recognizer.onerror=()=>toast('语音识别没有成功，请尝试文字输入');recognizer.start();toast('正在听你说话…')}
// Delegated UI actions.
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-page],[data-prompt]');if(!el)return;if(el.dataset.prompt){openAgent();document.getElementById('chat-input').value=el.dataset.prompt;agentSubmit();return}if(el.dataset.page){if(el.dataset.page==='library'||el.dataset.page==='today'||el.dataset.page==='review'){closeAgent();closeModal();page(el.dataset.page)}return}const a=el.dataset.action,id=el.dataset.id;if(a==='agent')openAgent();else if(a==='agent-close')closeAgent();else if(a==='modal-close')closeModal();else if(a==='task-add')formTask();else if(a==='note-add')formNote();else if(a==='add-type')formAddType();else if(a==='parent-book')formParent('book');else if(a==='parent-course')formParent('course');else if(a==='open-record')formRecord(el.dataset.type,id);else if(a==='view-parent')viewParent(el.dataset.type,id);else if(a==='view-note')editViewNote(id);else if(a==='view-task')viewTask(id);else if(a==='task-toggle')completeTask(id);else if(a==='task-complete')completeTask(id,true);else if(a==='dismiss')dismiss(id);else if(a==='renew')renew(id);else if(a==='send-chat')agentSubmit();else if(a==='voice')listen();else if(a==='filter'){filter=el.dataset.filter;renderLibrary();hydrateIcons(document.getElementById('page-library'))}else if(a==='agent-summary')agentSummary();else if(a==='reminders'){page('review');toast('已打开回顾与历史提醒')}});
document.addEventListener('submit',e=>{if(e.target.id==='form-task'){e.preventDefault();const f=new FormData(e.target);state.tasks.unshift({id:uid('t'),title:f.get('title').trim(),due:f.get('due'),group:f.get('group'),done:false,created:todayISO()});activity();save();closeModal();renderAll();toast('待办已添加');return}if(e.target.id==='form-parent'){e.preventDefault();const f=new FormData(e.target),type=f.get('type');let obj={id:uid(type==='book'?'b':'c'),name:f.get('name').trim(),current:Number(f.get('current')),total:Number(f.get('total')),created:todayISO()};if(obj.current>obj.total){toast('当前进度不能超过总进度');return}state[type==='book'?'books':'courses'].push(obj);activity();save();closeModal();renderAll();toast(type==='book'?'已加入书籍':'已加入课程');return}if(e.target.id==='form-note'){e.preventDefault();const f=new FormData(e.target),id=f.get('id');let n=state.notes.find(n=>n.id===id);if(n){n.title=f.get('title').trim();n.body=f.get('body').trim();n.type=f.get('type')}else state.notes.unshift({id:uid('n'),title:f.get('title').trim(),body:f.get('body').trim(),type:f.get('type'),date:todayISO(),createdAt:Date.now()});activity();save();closeModal();renderAll();toast('记录已保存');return}if(e.target.id==='form-record'){e.preventDefault();if(!modalContext)return;const f=new FormData(e.target),{type,id}=modalContext,parent=(type==='book'?state.books:state.courses).find(o=>o.id===id);if(!parent)return;const count=state.logs.filter(l=>l.parentType===type&&l.parentId===id).length;state.logs.push({id:uid('l'),parentType:type,parentId:id,title:(f.get('chapter').trim()?f.get('chapter').trim()+' · ':'')+'学习记录 '+(count+1),body:f.get('body').trim(),link:f.get('link').trim(),date:todayISO(),createdAt:Date.now()});activity();save();closeModal();renderAll();toast('学习记录已保存并关联到项目');return}if(e.target.id==='form-progress'){e.preventDefault();const f=new FormData(e.target),type=f.get('type'),obj=(type==='book'?state.books:state.courses).find(p=>p.id===f.get('id'));if(!obj)return;const current=Number(f.get('current')),total=Number(f.get('total'));if(current>total){toast('当前进度不能大于总进度');return}obj.current=current;obj.total=total;activity();save();closeModal();renderAll();toast('学习进度已更新')}});
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();agentSubmit()}});
document.getElementById('top-search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchTerm=e.target.value.trim();filter='all';page('library');}});
document.getElementById('modal-layer').addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal()});document.getElementById('agent-layer').addEventListener('click',e=>{if(e.target.id==='agent-layer')closeAgent()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeAgent()}});
renderAll();hydrateIcons();save();
</script>
</body>
</html>
